name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            node: 22.23.3
          - os: windows-latest
            node: 24.21.0
          - os: ubuntu-latest
            node: 22.23.3
          - os: ubuntu-latest
            node: 20.20.2
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Check syntax
        run: npm run check
      - name: Build application
        run: npm run build
      - name: Verify generated application
        run: npm run verify:artifact
      - name: Check findings register
        run: npm run check:findings
      - name: Check documentation links
        run: npm run check:doc-links
      - name: Reject tracked build changes
        run: git diff --exit-code HEAD --
